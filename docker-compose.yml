# Pushpak Index — full prototype in four containers.
#
#   docker compose up --build
#     landing page      http://localhost:8080
#     ops dashboard     http://localhost:8080/dashboard   (or :8000/dashboard)
#     API docs          http://localhost:8080/docs
#
# The api service seeds a labelled synthetic history at build time, so the
# stack is demoable immediately with no manual steps.

services:
  api:
    build: .
    image: pushpak-api
    container_name: pushpak-api
    environment:
      PUSHPAK_DB: /data/pushpak.db
      PUSHPAK_AUDIT_LOG: /data/scrape_audit.jsonl
    volumes:
      - pushpak-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Unattended daily collection and indexing. Shares the api service's image
  # and its data volume; the jobs are idempotent per run_date so a restart
  # cannot double-collect.
  cron:
    build: .
    image: pushpak-api
    container_name: pushpak-cron
    command: ["python", "-m", "pushpak.cli", "schedule"]
    environment:
      PUSHPAK_DB: /data/pushpak.db
      PUSHPAK_AUDIT_LOG: /data/scrape_audit.jsonl
      TZ: Asia/Kolkata
    volumes:
      - pushpak-data:/data
    depends_on:
      api:
        condition: service_healthy
    # The image's default healthcheck probes uvicorn, which this service does
    # not run, so it would fail forever. Replace it with one that actually
    # means something here: the scheduler can reach its database. That catches
    # a bad volume mount or permissions, which would otherwise show up only as
    # silently missing collection days.
    healthcheck:
      test: ["CMD", "python", "-c", "import pushpak.scheduler as s; s.recent(1); print('ok')"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # The site. A Next.js app on its own Node process, reachable only through
  # the proxy below — publishing it directly would give the demo two URLs and
  # let someone open the site on an origin where /api does not resolve.
  web:
    build:
      context: ./web
      args:
        # Next freezes rewrite destinations into the route manifest during the
        # build, so this is a build argument and not an environment variable:
        # setting it at run time would be read by nothing. In this stack nginx
        # routes the API paths before Next sees them, so these rewrites are the
        # fallback that keeps the image correct if it is ever run without the
        # proxy in front.
        PUSHPAK_API_ORIGIN: http://api:8000
    image: pushpak-web
    container_name: pushpak-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # The single origin: the site on /, the API and the operations dashboard on
  # their own paths, one port for the whole prototype.
  proxy:
    image: nginx:1.27-alpine
    container_name: pushpak-proxy
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./deploy/nginx/proxy_params_pushpak:/etc/nginx/proxy_params_pushpak:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pushpak-data:
