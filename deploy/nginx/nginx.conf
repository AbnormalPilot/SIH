# The single origin for the whole prototype.
#
#   /                 -> Next.js server (web:3000)
#   /api/, /dashboard,
#   /docs, /static/,
#   /openapi.json     -> FastAPI (api:8000)
#
# nginx matches the longest prefix, so the API locations below win over `/`
# even though `/` is declared first. Keeping both behind one port is what lets
# the site call the API with bare relative paths and no CORS.
server {
    listen 80;
    server_name _;

    # Cookies are not scoped by port, so a browser sends every cookie it holds
    # for "localhost" to this server, including ones set by unrelated dev
    # servers on other ports. That jar routinely exceeds nginx's default
    # 4x8k header buffers and the request is rejected with 400 before it ever
    # reaches the app. Pushpak itself sets no cookies; these buffers exist purely
    # to tolerate a busy localhost.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # Next already serves its own build output compressed and immutable-tagged,
    # so this only picks up what the Node server hands over uncompressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/proxy_params_pushpak;
        # Next uses a websocket for router updates and error overlays. Without
        # the upgrade headers those connections hang instead of failing fast.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/         { proxy_pass http://api:8000; include /etc/nginx/proxy_params_pushpak; }
    location /dashboard    { proxy_pass http://api:8000; include /etc/nginx/proxy_params_pushpak; }
    location /static/      { proxy_pass http://api:8000; include /etc/nginx/proxy_params_pushpak; }
    location /docs         { proxy_pass http://api:8000; include /etc/nginx/proxy_params_pushpak; }
    location /openapi.json { proxy_pass http://api:8000; include /etc/nginx/proxy_params_pushpak; }
}
